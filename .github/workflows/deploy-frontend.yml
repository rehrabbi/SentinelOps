name: Deploy frontend

# Builds the frontend and uploads it, with the /api proxy function, to the
# Cloudflare Pages project that Terraform created. Only main is ever deployed,
# and main only receives pull requests that passed every required check.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

# Least privilege: the job only reads the code. The Cloudflare token comes from
# the production environment below, not from the default GitHub token.
permissions:
  contents: read

# Never cancel a deploy halfway; a newer one waits for the older to finish.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # The Cloudflare token is stored in this environment, which only releases
    # it to jobs that declare it and, by its branch rule, only on main. A pull
    # request's workflow cannot read it, even one that edits this file.
    environment:
      name: production
      url: https://sentinelops.pages.dev
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job never pushes, so the GitHub token is not left on disk.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json records, wrangler included.
      - run: npm ci

      # An empty API address makes the app call /api on its own site, where the
      # Pages Function forwards it to the API. Same origin, first-party cookie.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ""

      # Uploads dist/ and compiles functions/ into the site's proxy. The project
      # name and branch must match infra/frontend.tf.
      - name: Upload to Cloudflare Pages
        id: upload
        run: |
          set -o pipefail
          npx wrangler pages deploy dist --project-name sentinelops --branch main --commit-hash "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/wrangler.log"
          # The address of exactly this deployment, so the check below tests
          # it rather than whichever deployment the main address serves.
          url="$(grep -oE 'https://[0-9a-f]+\.sentinelops\.pages\.dev' "$RUNNER_TEMP/wrangler.log" | tail -1)"
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no deployment address"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      # /api/healthz through this deployment's own proxy needs its PROXY_SECRET
      # to match the API's. A mismatch refuses every API call with 403, and on
      # 2026-11-24 one went unnoticed until a deployment exposed it, for about
      # two minutes. Failing here emails the owner at once. Retries cover the
      # API waking up, which can take up to a minute.
      - name: Check the API through this deployment
        env:
          DEPLOYMENT_URL: ${{ steps.upload.outputs.url }}
        run: |
          for attempt in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$DEPLOYMENT_URL/api/healthz" || true)"
            echo "attempt $attempt: $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$DEPLOYMENT_URL/api/healthz answered $code, not 200. A 403 means the proxy and the API disagree on PROXY_SECRET; see docs/RUNBOOK.md §4."
          exit 1
