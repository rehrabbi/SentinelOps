name: CI

# Run on every push to main and on every pull request targeting main, so a branch
# is checked before it is merged rather than after. Pull requests into the redesign
# branch are checked too, so the frontend redesign is held to the same bar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, redesign]

# Least privilege. The default token can write to the repository; this workflow only
# needs to read the code, so everything else is dropped.
permissions:
  contents: read

# If a branch is pushed twice in quick succession, cancel the older run instead of
# paying for a result nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    # A throwaway Postgres for the integration tests, the same major version as
    # production and Compose. It exists only for this job; the password is a
    # fixed CI-only value, not a secret.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: sentinelops
        ports:
          - 5432:5432
        # Tests start only once Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the version from go.mod rather than repeating it here, so the
          # toolchain can never drift from what the module declares.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # gofmt rewrites nothing in CI. It lists files that are not formatted, and any
      # output at all fails the job.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Unit tests, plus the integration tests in integration_test.go, which drive
      # the real API against the service above. Each run creates and drops its own
      # database there; without TEST_DATABASE_URL they would fail here, not skip.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://sentinel:ci-only-not-secret@localhost:5432/sentinelops?sslmode=disable
        run: go test ./...

  frontend:
    name: Frontend (React, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json pins and fails if the lockfile
      # and package.json disagree. npm install would quietly resolve new versions,
      # which is the wrong behaviour for a build you want to be reproducible.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Runs tsc -b and then the Vite production build, so a type error fails CI.
      - name: Type check and build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own throwaway Postgres, the same version as Compose and production. The run drops and
    # recreates the sentinelops_e2e database on it; the password is a fixed CI-only value.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: sentinelops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_DATABASE_URL: postgres://sentinel:ci-only-not-secret@localhost:5432/sentinelops_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tests build and run the API from this checkout.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium and the system libraries it needs. Not cached: Playwright advises against it,
      # since restoring the browser takes about as long as downloading it, and the system
      # libraries have to be installed on every run anyway.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts does the rest: the global setup resets the database, builds the API,
      # migrates and starts it; the web server builds the frontend as production does
      # (VITE_API_URL empty) and serves it with /api on the same origin.
      - name: Run the end-to-end tests
        run: npm run e2e

      # The HTML report, traces, screenshots and the API's log, only when something failed.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/e2e-output/report/
            frontend/e2e-output/results/
            frontend/e2e-output/api.log
          retention-days: 7

  infrastructure:
    name: Infrastructure (Terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Terraform version used locally. The wrapper is off so that
      # commands behave exactly as they do on a developer's machine.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      # Lists any file that is not in canonical format, and fails if there is one.
      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false installs the providers, checked against the lock file's
      # hashes, without contacting the state backend, so CI needs no database
      # and no secret. -lockfile=readonly fails if the lock file would change.
      - name: Install providers
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate
