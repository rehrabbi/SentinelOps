name: Keep schedules alive

# GitHub disables a public repository's scheduled workflows after 60 days with
# no activity (commits to main), and says so only on the Actions page. Here the
# schedules are the safety net (Audit verify, Backup, ZAP baseline, Render
# hours), and a quiet project is exactly when they must keep running.
#
# Re-enabling a workflow through GitHub's API restarts that clock, so on the
# 1st of each month this re-enables every workflow that is active or was
# switched off for inactivity, itself included. A workflow someone disabled
# by hand ("disabled_manually") is left alone, and so are GitHub's own (such as
# Dependabot's), which live outside .github/workflows. No commits are made.
on:
  schedule:
    - cron: "41 5 1 * *" # 05:41 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  actions: write # enabling a workflow; nothing else

jobs:
  enable:
    name: Re-enable scheduled workflows
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          gh api "repos/$REPO/actions/workflows" --paginate \
            --jq '.workflows[] | select(.path | startswith(".github/workflows/")) | select(.state == "active" or .state == "disabled_inactivity") | "\(.id) \(.state) \(.path)"' |
            while read -r id state path; do
              gh api -X PUT "repos/$REPO/actions/workflows/$id/enable"
              echo "re-enabled $path (was $state)"
              echo "- \`$path\`: re-enabled (was $state)" >> "$GITHUB_STEP_SUMMARY"
            done
