name: Publish

# Publishes the API image to GitHub Container Registry, but only once the Security
# workflow has passed on main for that exact commit. A pull request already passed
# every required check, but the scans also run again on main after the merge, and a
# vulnerability published in between should stop the image from shipping.
on:
  workflow_run:
    workflows: [Security]
    types: [completed]
    branches: [main]
  workflow_dispatch: # publish the current main by hand from the Actions tab

# Nothing by default; the one job asks for exactly what it needs.
permissions: {}

# Never cancel a publish half way: a pushed image without its attestation would be
# worse than waiting for the run in front.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  api:
    name: Publish API image
    # Only after a successful Security run triggered by a push to main. The weekly
    # scheduled scan also runs on main, and must not rebuild and overwrite a tag
    # that is meant to name one immutable build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read      # check out the code
      packages: write     # push to ghcr.io
      id-token: write     # prove this workflow's identity when signing
      attestations: write # store the signed provenance
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sentinelops-api
      # The commit the Security run scanned. A workflow_run job otherwise checks out
      # the newest main, which may be a later commit that was never scanned.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}

      # Two tags: sha-<commit> names exactly one build and never moves, so a deploy
      # can pin to it and roll back to it; main always points at the newest build.
      # The source label links the package to this repository on GitHub.
      - name: Build
        run: >-
          docker build backend
          --tag "$IMAGE:sha-$SHA"
          --tag "$IMAGE:main"
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --label "org.opencontainers.image.revision=$SHA"

      # The same fail policy as the Security workflow, applied to the exact image
      # about to be published, since a rebuild can pick up different base packages.
      - name: Fail on fixable High or Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The workflow's own short-lived token; no stored secret is involved.
      - name: Log in to GitHub Container Registry
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The registry answers each push with the image's digest, a hash of its exact
      # contents. The attestation is bound to that digest, not to a tag.
      - name: Push
        id: push
        run: |
          docker push "$IMAGE:sha-$SHA"
          docker push "$IMAGE:main"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$SHA" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE@$digest"

      # Signed provenance: this repository, this commit, this workflow built this
      # digest. Anyone can check it with: gh attestation verify oci://<image> --owner <owner>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
