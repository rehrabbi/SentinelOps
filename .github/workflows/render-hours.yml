name: Render hours

# Every Monday, and on demand: warns before Render's free instance hours can run
# out. All free services share 750 hours a month, and when they are spent Render
# suspends every free service, production included, until the 1st. The API
# alone uses up to 744 (uptime checks keep it awake), so a second free service
# left running is enough. infra/render-hours.sh projects the worst case and
# fails when it exceeds the allowance or the API is suspended; a failed
# scheduled run emails the owner.
on:
  schedule:
    - cron: "7 5 * * 1" # 05:07 UTC on Mondays, after the ZAP baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-hours
  cancel-in-progress: false

jobs:
  check:
    name: Project this month's free hours
    runs-on: ubuntu-latest
    # Holds RENDER_API_KEY and releases it only to runs from main. Render's keys
    # cannot be limited, so this key can do anything in the workspace; this job
    # only reads the service list.
    environment: render
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra/render-hours.sh
          sparse-checkout-cone-mode: false

      - name: Check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: infra/render-hours.sh
